<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>live2d-preview · 分层 PNG 伪 Live2D</title>
<style>
  :root{ --ink:#efe6d6; --dim:#9d9483; --gold:#f0d48a; --line:#2c2a34; --bg:#0b0b10; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;}
  .app{display:flex;gap:18px;align-items:flex-start;padding:16px;max-width:1500px;margin:0 auto;}
  #stage{flex:1 1 auto;min-width:0;display:flex;justify-content:center;
    background:radial-gradient(60% 60% at 50% 40%,#16161f,#08080c);
    border:1px solid var(--line);border-radius:12px;padding:10px;}
  #stage canvas{display:block;max-width:100%;max-height:80vh;width:auto;height:auto;
    cursor:crosshair;border-radius:6px;}
  aside{flex:0 0 316px;display:flex;flex-direction:column;gap:12px;}
  h1{font-size:17px;margin:0;}
  h1 small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px;}
  fieldset{border:1px solid var(--line);border-radius:10px;margin:0;padding:10px 12px 12px;}
  legend{color:var(--gold);font-size:12px;padding:0 5px;}
  select,button,input[type=file]{font:inherit;color:var(--ink);background:#1a1a22;
    border:1px solid #35333f;border-radius:7px;padding:5px 9px;}
  select{width:100%}
  button{cursor:pointer}
  button:hover{border-color:#5b5670}
  button.on{background:#3a3320;border-color:#6b5a2c;color:var(--gold)}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  label.sl{display:block;margin:7px 0 0;color:var(--dim);font-size:12px}
  label.sl b{color:var(--ink);float:right;font-weight:400}
  input[type=range]{width:100%;margin:2px 0 0}
  #note,#status{color:var(--dim);font-size:12px;margin:0}
  #note b{color:var(--gold)}
  .warn{color:#ffb27a}
  #layers{max-height:270px;overflow:auto;font-size:12px}
  #layers div{display:flex;align-items:center;gap:6px;padding:1px 0;white-space:nowrap}
  #layers span.r{color:var(--gold);flex:0 0 92px}
  #layers span.f{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  #layers div.bad span.f{color:#ff8c6b}
  code{background:#17161d;padding:1px 5px;border-radius:4px;color:#cfc3a6}
</style>
</head>
<body>
<div class="app">
  <div id="stage"><canvas id="c" width="1024" height="1536"></canvas></div>

  <aside>
    <h1>live2d-preview
      <small>分层 PNG 伪 Live2D · 无 Cubism 运行时 · 无构建步骤</small>
    </h1>

    <fieldset>
      <legend>角色</legend>
      <select id="pick"></select>
      <p id="note"></p>
      <p id="status"></p>
    </fieldset>

    <fieldset>
      <legend>动作</legend>
      <div class="btns">
        <button id="pause">暂停</button>
        <button id="blink">眨眼</button>
        <button id="gust">吹风</button>
        <button id="rest" class="on">静止姿势</button>
        <button id="piv">轴点</button>
      </div>
      <label class="sl">鼠标跟随（眼/头/身）<b id="vFollow">100%</b>
        <input type="range" id="follow" min="0" max="200" value="100"></label>
      <label class="sl">呼吸<b id="vBreath">100%</b>
        <input type="range" id="breath" min="0" max="250" value="100"></label>
      <label class="sl">头发/裙摆摆动<b id="vSway">100%</b>
        <input type="range" id="sway" min="0" max="250" value="100"></label>
      <label class="sl">软体弯曲（分条形变）<b id="vBend">100%</b>
        <input type="range" id="bend" min="0" max="250" value="100"></label>
    </fieldset>

    <fieldset>
      <legend>指到别的层文件夹</legend>
      <input type="file" id="dir" webkitdirectory directory multiple>
      <p style="color:var(--dim);font-size:12px;margin:6px 0 0">
        选一个含 <code>*.png</code> + <code>pivots.json</code> 的目录，
        部位按文件名自动识别。<code>file://</code> 下也能用。
      </p>
    </fieldset>

    <fieldset>
      <legend>图层（点勾选隔离）</legend>
      <div id="layers"></div>
    </fieldset>
  </aside>
</div>

<script src="puppet.js"></script>
<script src="models/c001-puppet.model.js"></script>
<script src="models/c001-preview.model.js"></script>
<script src="models/elevator-red.model.js"></script>
<script>
(function(){
  'use strict';
  var canvas = document.getElementById('c');
  var stage  = document.getElementById('stage');
  var pick   = document.getElementById('pick');
  var note   = document.getElementById('note');
  var statusEl = document.getElementById('status');
  var layersEl = document.getElementById('layers');
  var pup = null;

  DCPuppet.registry.forEach(function(m, i){
    var o = document.createElement('option');
    o.value = i; o.textContent = m.name || m.id;
    pick.appendChild(o);
  });

  function setStatus(txt, warn){
    statusEl.innerHTML = txt;
    statusEl.className = warn ? 'warn' : '';
  }

  function buildLayerList(){
    layersEl.innerHTML = '';
    pup.layers.forEach(function(L){
      var row = document.createElement('div');
      if (!L.ok) row.className = 'bad';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = L.on; cb.disabled = !L.ok;
      cb.onchange = function(){ L.on = cb.checked; };
      var r = document.createElement('span'); r.className='r'; r.textContent = L.role;
      var f = document.createElement('span'); f.className='f';
      f.textContent = (L.ok ? '' : '缺失 ') + L.name;
      f.title = L.name;
      row.appendChild(cb); row.appendChild(r); row.appendChild(f);
      layersEl.appendChild(row);
    });
  }

  function mount(model){
    if (pup) pup.stop();
    pup = new DCPuppet.Puppet(model, canvas, function(t){ setStatus(t); });
    note.innerHTML = model.note ? '<b>说明</b> ' + model.note : '';
    setStatus('读图中…');
    pup.load(function(){
      var msg = model.canvas[0] + '×' + model.canvas[1] + ' · '
              + pup.layers.filter(function(L){return L.ok;}).length + '/'
              + pup.layers.length + ' 层';
      if (pup.missing.length) msg += ' · <span class="warn">缺失: '
              + pup.missing.join(', ') + '</span>';
      if (model.skipped && model.skipped.length) msg += ' · 跳过 '
              + model.skipped.length + ' 个重复/参考文件';
      if (!pup.ready) msg = '<span class="warn">一张都没加载到。'
              + '检查 dir 路径，或用下面的目录选择器。</span>';
      setStatus(msg, !pup.ready);
      buildLayerList();
      syncOpts();
      pup.start();
    });
  }

  function toggle(id, key){
    var b = document.getElementById(id);
    b.onclick = function(){
      pup.opt[key] = !pup.opt[key];
      b.classList.toggle('on', pup.opt[key]);
      if (key === 'paused') b.textContent = pup.opt.paused ? '继续' : '暂停';
    };
  }
  toggle('pause','paused');
  toggle('rest','restPose');
  toggle('piv','showPivots');

  document.getElementById('blink').onclick = function(){
    pup.blinkUntil = performance.now() + 130;
  };
  document.getElementById('gust').onclick = function(){ pup.gust = 2.6; };

  [['follow','follow'],['breath','breath'],['sway','sway'],['bend','bend']]
  .forEach(function(p){
    var el = document.getElementById(p[0]);
    var out = document.getElementById('v' + p[0][0].toUpperCase() + p[0].slice(1));
    el.oninput = function(){
      pup.opt[p[1]] = el.value / 100;
      out.textContent = el.value + '%';
    };
  });

  function syncOpts(){
    pup.opt.follow = document.getElementById('follow').value / 100;
    pup.opt.breath = document.getElementById('breath').value / 100;
    pup.opt.sway   = document.getElementById('sway').value / 100;
    pup.opt.bend   = document.getElementById('bend').value / 100;
    pup.opt.paused = document.getElementById('pause').textContent === '继续';
    pup.opt.restPose   = document.getElementById('rest').classList.contains('on');
    pup.opt.showPivots = document.getElementById('piv').classList.contains('on');
  }

  stage.addEventListener('pointermove', function(e){
    var r = canvas.getBoundingClientRect();
    pup.look.tx = ((e.clientX - r.left) / r.width) * 2 - 1;
    pup.look.ty = ((e.clientY - r.top) / r.height) * 2 - 1;
  });
  stage.addEventListener('pointerleave', function(){
    pup.look.tx = 0; pup.look.ty = 0;
  });
  canvas.addEventListener('pointerdown', function(){ pup.gust = 2.4; });

  document.getElementById('dir').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files);
    if (!files.length) return;
    var label = (files[0].webkitRelativePath || files[0].name).split('/')[0];
    setStatus('解析目录…');
    DCPuppet.modelFromFiles(files, label).then(function(m){
      var o = document.createElement('option');
      o.value = DCPuppet.registry.length;
      o.textContent = '📁 ' + m.name;
      DCPuppet.registry.push(m);
      pick.appendChild(o);
      pick.value = o.value;
      mount(m);
    }).catch(function(err){ setStatus(String(err.message || err), true); });
  };

  pick.onchange = function(){ mount(DCPuppet.registry[pick.value | 0]); };

  var q = new URLSearchParams(location.search);
  if (q.get('dir')) {
    var fl = (q.get('files') || '').split(',').filter(Boolean);
    if (fl.length) {
      DCPuppet.modelFromDir(q.get('dir'), fl).then(mount)
        .catch(function(e){ setStatus(String(e.message||e), true); mount(DCPuppet.registry[0]); });
    } else {
      setStatus('?dir= 需要配合 &files=a.png,b.png 使用', true);
      mount(DCPuppet.registry[0]);
    }
  } else {
    var want = q.get('model');
    var idx = 0;
    DCPuppet.registry.forEach(function(m,i){ if (m.id === want) idx = i; });
    pick.value = idx;
    mount(DCPuppet.registry[idx]);
  }
})();
</script>
</body>
</html>
