<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__TITLE__ · 分层待机预览</title>
<style>
  html,body{margin:0;background:#08080b;color:#efe6d6;font:15px/1.5 "Microsoft YaHei",sans-serif;}
  .wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;max-width:1180px;margin:0 auto;padding:18px 16px 40px;}
  canvas{display:block;background:#0b0a0d;border-radius:10px;cursor:crosshair;
    width:min(88vh,440px);height:auto;box-shadow:0 0 70px #000;}
  .side{flex:1 1 320px;min-width:300px;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{color:#c9b48a;font-size:13px;margin:0 0 14px;}
  button{background:#241f16;color:#f0d48a;border:1px solid #574726;padding:6px 12px;
    border-radius:8px;cursor:pointer;margin:0 6px 7px 0;font-size:13px;}
  button:hover{background:#31291b;}
  button.on{background:#4a3c1d;color:#ffe9a8;}
  table{border-collapse:collapse;font-size:12.5px;margin-top:10px;width:100%;}
  th,td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid #23201a;}
  th{color:#c9b48a;font-weight:normal;}
  td.n{font-variant-numeric:tabular-nums;color:#dcd2bd;}
  .note{color:#a89c88;font-size:12.5px;margin:12px 0 0;}
  .note b{color:#f0d48a;font-weight:normal;}
  #err{color:#ff9b8a;font-size:13px;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="side">
    <h1>__TITLE__ · 分层待机预览</h1>
    <p class="sub">整张静帧当一张网格来变形，影响域是从真实分层 alpha 烘出来的。<br>
       切层里的破洞不会露出来，因为一个像素都没有重新拼贴。</p>
    <div>
      <button id="bPause">暂停</button>
      <button id="bWind">吹风</button>
      <button id="bTap">点胸</button>
      <button id="bLook">看这边</button>
      <button id="bFields">看权重</button>
    </div>
    <table id="hud"><tbody></tbody></table>
    <p class="note">画布可点：<b>脸</b>=看过来，<b>胸</b>=冲量，<b>头发</b>=阵风，<b>剑</b>=抖一下。</p>
    <p class="note">头发／胸的弹簧参数和 <b>physics3.json</b>、<b>PUPPET_IDLE_A.md</b> 同一套；
       这里是查看用的近似，Cubism 里由 physics 求解器接管。</p>
    <p id="err"></p>
  </div>
</div>
<script>
const RIG = __RIG__;

const VS = `#version 300 es
in vec2 aP;
uniform vec2 uCanvas, uHip, uNeck, uGrip, uRootHB, uRootHS, uRootHF, uChestLP, uChestRP;
uniform sampler2D uFA, uFB, uFL;
uniform float uChestSplit, uHairHB, uHairHS, uHairHF, uHeadZ, uSwordZ;
uniform float uChestL, uChestR, uBreath, uTwist, uHoverY, uSwayX;
out vec2 vUV;
out vec4 vFA, vFB;
vec2 rotAbout(vec2 p, vec2 c, float a){
  float s = sin(a), k = cos(a);
  vec2 d = p - c;
  return c + vec2(d.x*k - d.y*s, d.x*s + d.y*k);
}
void main(){
  vUV = aP;
  vec4 wa = textureLod(uFA, aP, 0.0);
  vec4 wb = textureLod(uFB, aP, 0.0);
  vec4 lv = textureLod(uFL, aP, 0.0);
  vFA = wa; vFB = wb;
  vec2 p = aP * uCanvas;
  float free = 1.0 - wb.a;                       // feet stay planted
  p += vec2(uSwayX, uHoverY) * free;
  p = mix(p, rotAbout(p, uHip, uTwist), free);
  vec2 rad = p - uHip;
  p += normalize(rad + vec2(1e-4)) * (uBreath * 3.5) * lv.a;
  p = mix(p, rotAbout(p, uNeck,   uHeadZ), wa.a);
  p = mix(p, rotAbout(p, uRootHB, uHairHB * (0.30 + 0.70*lv.r)), wa.r);
  p = mix(p, rotAbout(p, uRootHS, uHairHS * (0.30 + 0.70*lv.g)), wa.g);
  p = mix(p, rotAbout(p, uRootHF, uHairHF * (0.30 + 0.70*lv.b)), wa.b);
  float side = step(uChestSplit, p.x);           // each lobe hangs from its own edge
  p = mix(p, rotAbout(p, mix(uChestLP, uChestRP, side), mix(uChestL, uChestR, side)), wb.r);
  p = mix(p, rotAbout(p, uGrip, uSwordZ), wb.b);
  vec2 clip = (p / uCanvas) * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec2 vUV;
in vec4 vFA, vFB;
uniform sampler2D uTex, uBounce;
uniform vec2 uCanvas;
uniform vec4 uChestRect;
uniform float uBounceMix, uDebug;
out vec4 o;
void main(){
  vec4 c = texture(uTex, vUV);
  if(uChestRect.z > 0.5){
    vec2 q = (vUV*uCanvas - uChestRect.xy) / uChestRect.zw;
    if(q.x > 0.0 && q.x < 1.0 && q.y > 0.0 && q.y < 1.0){
      float edge = min(min(q.x, 1.0-q.x), min(q.y, 1.0-q.y));
      c = mix(c, texture(uBounce, q), clamp(uBounceMix,0.0,1.0) * smoothstep(0.0,0.10,edge));
    }
  }
  if(uDebug > 0.5){
    vec3 t = vec3(vFA.r*0.95 + vFB.b*0.6, vFA.g*0.95 + vFA.a*0.8, vFA.b*0.95 + vFB.r*0.9);
    t += vec3(vFB.g*0.16);
    c.rgb = mix(c.rgb*0.30, clamp(t,0.0,1.0), 0.72);
    c.a = max(c.a, 0.55*clamp(t.r+t.g+t.b,0.0,1.0));
  }
  o = vec4(c.rgb*c.a, c.a);
}`;

const cv = document.getElementById("c");
const [CW, CH] = RIG.canvas;
cv.width = Math.round(CW * 0.5);
cv.height = Math.round(CH * 0.5);
const gl = cv.getContext("webgl2", {alpha:true, premultipliedAlpha:true, antialias:true});
if(!gl){ document.getElementById("err").textContent = "这台机器没有 WebGL2，换 Chrome / Edge 打开。"; }

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// ---- warp grid
const GX = 128, GY = 192;
const verts = new Float32Array(GX*GY*2);
for(let y=0, i=0; y<GY; y++) for(let x=0; x<GX; x++){
  verts[i++] = x/(GX-1); verts[i++] = y/(GY-1);
}
const idx = new Uint32Array((GX-1)*(GY-1)*6);
for(let y=0, i=0; y<GY-1; y++) for(let x=0; x<GX-1; x++){
  const a=y*GX+x, b=a+1, c2=a+GX, d=c2+1;
  idx[i++]=a; idx[i++]=b; idx[i++]=c2; idx[i++]=b; idx[i++]=d; idx[i++]=c2;
}
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "aP");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

// ---- textures
let pending = 0, ready = false;
function tex(unit, uri, name){
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,0]));
  for(const [k,v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
                      [gl.TEXTURE_MIN_FILTER, gl.LINEAR],[gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) {
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  }
  gl.uniform1i(gl.getUniformLocation(prog, name), unit);
  if(!uri) return t;
  pending++;
  const im = new Image();
  im.onload = () => {
    gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    if(--pending === 0){ ready = true; }
  };
  im.onerror = () => { document.getElementById("err").textContent = "贴图加载失败: " + name; };
  im.src = uri;
  return t;
}
tex(0, RIG.still,  "uTex");
tex(1, RIG.fieldA, "uFA");
tex(2, RIG.fieldB, "uFB");
tex(3, RIG.fieldL, "uFL");
tex(4, RIG.chest && RIG.chest.bounce, "uBounce");

const U = {};
for(const n of ["uCanvas","uHip","uNeck","uGrip","uRootHB","uRootHS","uRootHF","uChestLP","uChestRP",
                "uChestSplit","uHairHB","uHairHS","uHairHF","uHeadZ","uSwordZ","uChestL","uChestR",
                "uBreath","uTwist","uHoverY","uSwayX","uChestRect","uBounceMix","uDebug"]) {
  U[n] = gl.getUniformLocation(prog, n);
}

// ---- rig anchors, in canvas pixels (y down)
const R = RIG.rigs || {};
const uv2px = (m, fb) => m ? [m[0]*CW, (1-m[1])*CH] : fb;
const rootOr = (k, fb) => (R[k] && R[k].root) ? R[k].root : fb;
const HIP   = RIG.hip || [CW*0.5, CH*0.55];
const NECK  = uv2px(RIG.landmarks && RIG.landmarks.head, rootOr("head", [CW*0.5, CH*0.22]));
const GRIP  = rootOr("sword", uv2px(RIG.landmarks && RIG.landmarks.hand_r, [CW*0.43, CH*0.45]));
const ROOT_HB = rootOr("hair_back",  [CW*0.35, CH*0.20]);
const ROOT_HS = rootOr("hair_side",  [CW*0.70, CH*0.34]);
const ROOT_HF = rootOr("hair_front", [CW*0.47, CH*0.10]);
const CR = RIG.chest ? RIG.chest.rect : null;
const SPLIT = CR ? CR[0] + CR[2]*0.5 : CW*0.5;
// Lobes hang from their own upper edge, never from the cleavage.
const CHEST_LP = CR ? [CR[0] + CR[2]*0.24, CR[1] + CR[3]*0.10] : [0,0];
const CHEST_RP = CR ? [CR[0] + CR[2]*0.74, CR[1] + CR[3]*0.10] : [0,0];

gl.uniform2f(U.uCanvas, CW, CH);
gl.uniform2fv(U.uHip, HIP);      gl.uniform2fv(U.uNeck, NECK);
gl.uniform2fv(U.uGrip, GRIP);    gl.uniform2fv(U.uRootHB, ROOT_HB);
gl.uniform2fv(U.uRootHS, ROOT_HS); gl.uniform2fv(U.uRootHF, ROOT_HF);
gl.uniform2fv(U.uChestLP, CHEST_LP); gl.uniform2fv(U.uChestRP, CHEST_RP);
gl.uniform1f(U.uChestSplit, SPLIT);
gl.uniform4f(U.uChestRect, CR?CR[0]:0, CR?CR[1]:0, CR?CR[2]:0, CR?CR[3]:0);

// ---- springs. Same shape as the Unity PuppetMotion solver: analytic damped
// spring tracking a slow target, impulses add velocity without resetting.
class Spring {
  constructor(freq, zeta, limit){ this.x=0; this.v=0; this.f=freq; this.z=zeta; this.lim=limit; }
  step(target, dt){
    const w = this.f * Math.PI * 2;
    this.v += (-2*this.z*w*this.v - w*w*(this.x-target)) * dt;
    this.x += this.v * dt;
    if(this.x >  this.lim){ this.x =  this.lim; this.v *= -0.25; }
    if(this.x < -this.lim){ this.x = -this.lim; this.v *= -0.25; }
    return this.x;
  }
  kick(a){ this.v += a; }
}
const D = Math.PI/180;
const hb = new Spring(0.52, 0.30, 3.4*D);
const hs = new Spring(0.60, 0.32, 3.0*D);
const hf = new Spring(1.05, 0.42, 1.5*D);
const cL = new Spring(1.55, 0.26, 1.9*D);
const cR = new Spring(1.48, 0.27, 1.9*D);
const hz = new Spring(0.70, 0.55, 2.4*D);
const sw = new Spring(0.85, 0.40, 1.4*D);
let gust = 0, look = 0, paused = false, debug = false;
let t0 = performance.now(), last = t0, fps = 60;

const hud = document.querySelector("#hud tbody");
const rows = {};
function hudRow(k){
  if(!rows[k]){
    const tr = document.createElement("tr");
    tr.innerHTML = `<th>${k}</th><td class="n"></td>`;
    hud.appendChild(tr); rows[k] = tr.querySelector("td");
  }
  return rows[k];
}

function frame(now){
  const dt = Math.min(1/30, Math.max(1/480, (now-last)/1000));
  last = now; fps += ((1/dt) - fps) * 0.05;
  const t = (now - t0) / 1000;
  if(!paused){
    const wind = Math.sin(t*0.47)*0.62 + Math.sin(t*0.19+1.3)*0.30 + gust;
    hb.step( wind * 3.4*D, dt);
    hs.step(-wind * 2.6*D, dt);
    hf.step( wind * 1.2*D, dt);
    // Idle A: both lobes swing the same way from their own attachment.
    const cT = Math.sin(t*0.52) * 1.35*D;
    cL.step(cT, dt); cR.step(cT*0.92, dt);
    hz.step(Math.sin(t*0.33)*1.1*D + look, dt);
    sw.step(Math.sin(t*0.41)*0.7*D, dt);
    gust *= Math.pow(0.28, dt); look *= Math.pow(0.35, dt);
  }
  const breath = 0.5 + 0.5*Math.sin(t*0.92);
  gl.uniform1f(U.uHairHB, hb.x); gl.uniform1f(U.uHairHS, hs.x); gl.uniform1f(U.uHairHF, hf.x);
  gl.uniform1f(U.uChestL, cL.x); gl.uniform1f(U.uChestR, cR.x);
  gl.uniform1f(U.uHeadZ, hz.x);  gl.uniform1f(U.uSwordZ, sw.x);
  gl.uniform1f(U.uBreath, breath);
  gl.uniform1f(U.uTwist, Math.sin(t*0.23)*0.9*D);
  gl.uniform1f(U.uHoverY, Math.sin(t*0.92)*2.2);
  gl.uniform1f(U.uSwayX, Math.sin(t*0.31)*2.6);
  gl.uniform1f(U.uBounceMix, Math.min(1, Math.abs(cL.x + cR.x) / (2.6*D)));
  gl.uniform1f(U.uDebug, debug ? 1 : 0);

  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.043, 0.039, 0.051, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if(ready){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vao);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
  }
  hudRow("后发 / 侧发 / 前发").textContent =
    `${(hb.x/D).toFixed(2)}° ${(hs.x/D).toFixed(2)}° ${(hf.x/D).toFixed(2)}°`;
  hudRow("胸 左 / 右").textContent = `${(cL.x/D).toFixed(2)}° ${(cR.x/D).toFixed(2)}°`;
  hudRow("头 / 剑").textContent = `${(hz.x/D).toFixed(2)}° ${(sw.x/D).toFixed(2)}°`;
  hudRow("呼吸").textContent = breath.toFixed(2);
  hudRow("网格 / fps").textContent = `${GX}×${GY} · ${fps.toFixed(0)}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- hit areas, straight off the landmarks
function hit(ev){
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * CW;
  const y = (ev.clientY - r.top) / r.height * CH;
  if(CR && x > CR[0] && x < CR[0]+CR[2] && y > CR[1] && y < CR[1]+CR[3]){
    (x < SPLIT ? cL : cR).kick(9.5*D);
    (x < SPLIT ? cR : cL).kick(4.0*D);
    return;
  }
  const hb2 = R.head && R.head.bbox;
  if(hb2 && x > hb2[0]-24 && x < hb2[2]+24 && y > hb2[1]-24 && y < hb2[3]+24){
    look = (x < NECK[0] ? 1 : -1) * 2.0*D; hz.kick(4.0*D); return;
  }
  const sb = R.sword && R.sword.bbox;
  if(sb && x > sb[0]-20 && x < sb[2]+20 && y > sb[1]-20 && y < sb[3]+20){ sw.kick(7.0*D); return; }
  gust = 2.2; hb.kick(4.0*D); hs.kick(-3.0*D);
}
cv.addEventListener("pointerdown", hit);
const B = id => document.getElementById(id);
B("bPause").onclick = e => { paused = !paused; e.target.textContent = paused ? "继续" : "暂停"; e.target.classList.toggle("on", paused); };
B("bWind").onclick  = () => { gust = 2.6; hb.kick(5.0*D); hs.kick(-3.6*D); hf.kick(2.4*D); };
B("bTap").onclick   = () => { cL.kick(9.5*D); cR.kick(7.0*D); };
B("bLook").onclick  = () => { look = 2.2*D; hz.kick(4.5*D); };
B("bFields").onclick= e => { debug = !debug; e.target.classList.toggle("on", debug); };
</script>
</body>
</html>
